when:
  - event: manual

labels:
  platform: windows/amd64
  backend: local

steps:
  - name: verify
    image: powershell
    commands:
      - npm install --no-audit --no-fund
      - npm run ci
  - name: fleet
    image: powershell
    commands:
      - npm run scan -- fleet examples/fleet.yml .artisys/fleet-report.json
      - npm run scan -- dashboard .artisys/fleet-report.json .artisys/dashboard
