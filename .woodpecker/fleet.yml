when:
  - event: manual

labels:
  platform: windows/amd64
  backend: local
  pilot: pdv-artisys

steps:
  - name: verify
    image: powershell.exe
    commands:
      - '$ErrorActionPreference = "Stop"'
      - npm install --no-audit --no-fund
      - npm run ci
  - name: fleet
    image: powershell.exe
    commands:
      - '$ErrorActionPreference = "Stop"'
      - npm run scan -- fleet examples/fleet.yml .artisys/fleet-report.json
      - npm run scan -- dashboard .artisys/fleet-report.json .artisys/dashboard
