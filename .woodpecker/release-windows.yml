when:
  - event: manual

labels:
  platform: windows/amd64
  backend: local
  privilege: elevated

steps:
  - name: verify
    image: powershell
    commands:
      - npm install --no-audit --no-fund
      - npm run ci
  - name: release-readiness
    image: powershell
    commands:
      - npm run scan -- discover .
      - Write-Host "Release workflow validates the scanner engine only; target installer/update execution remains explicit and opt-in."
