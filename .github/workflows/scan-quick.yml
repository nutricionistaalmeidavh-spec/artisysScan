name: scan-quick

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Quick verification
        run: npm run ci

# Hosted isolation for pull requests + manual fallback only.
# Windows coverage reproduces the Woodpecker local-agent runtime without using the host directly.
# Trusted push CI is handled by Woodpecker. This workflow never publishes releases.
